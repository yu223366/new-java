# ============================================================
# 精灵宝可梦图鉴 - 后端配置
# 端口 8081，数据库 pokemon_db
# ============================================================
spring.application.name=springBootTest
server.port=8081
# 绑定本机局域网 IP（局域网/手机可通过该 IP 访问；如需监听所有网卡改为 0.0.0.0 或删除本行）
server.address=192.168.68.29

# ---------- 数据源 ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库在本机，用 localhost 连接（此处不要改成 192.168.68.29，MySQL root 仅授权 localhost）
spring.datasource.url=jdbc:mysql://localhost:3306/pokemon_game?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ---------- MyBatis-Plus ----------
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
# 下划线转驼峰(默认开启)
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ---------- 日志 ----------
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger{50}.%M %L:%m%n
